name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Determine deployment base path
        id: base-path
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo "base_href=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_href=/$repository_name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Angular app
        env:
          BASE_HREF: ${{ steps.base-path.outputs.base_href }}
        run: npm run build -- --base-href "$BASE_HREF"

      - name: Add SPA fallback
        run: cp dist/abc-pharmacy-ui/browser/index.html dist/abc-pharmacy-ui/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/abc-pharmacy-ui/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
