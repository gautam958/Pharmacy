<mat-sidenav-container class="layout">
  <mat-sidenav
    #drawer
    class="sidebar"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [fixedInViewport]="isMobile()"
  >
    <div class="brand">
      <div class="brand-logo"><mat-icon>local_pharmacy</mat-icon></div>
      <div>
        <div class="brand-name">ABC Pharmacy</div>
        <div class="brand-sub">Inventory &amp; Sales</div>
      </div>
    </div>

    <nav class="nav">
      <span class="nav-title">Menu</span>
      @for (item of menu; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="isMobile() && drawer.close()"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">&copy; {{ year }} ABC Pharmacy</div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    @if (isMobile()) {
      <mat-toolbar class="mobile-bar">
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Open menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="mobile-title">ABC Pharmacy</span>
      </mat-toolbar>
    }

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
