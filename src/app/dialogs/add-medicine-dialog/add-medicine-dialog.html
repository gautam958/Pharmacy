<h2 mat-dialog-title>Add Medicine</h2>

<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <mat-dialog-content>
    <mat-form-field class="full">
      <mat-label>Full Name</mat-label>
      <input matInput formControlName="fullName" maxlength="200" />
      <mat-error>Full name is required (max 200 characters).</mat-error>
    </mat-form-field>

    <mat-form-field class="full">
      <mat-label>Brand</mat-label>
      <input matInput formControlName="brand" maxlength="100" />
      <mat-error>Brand is required (max 100 characters).</mat-error>
    </mat-form-field>

    <div class="row">
      <mat-form-field>
        <mat-label>Expiry Date</mat-label>
        <input matInput type="date" formControlName="expiryDate" [min]="today" />
        <mat-error>Enter a date that is not in the past.</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Quantity</mat-label>
        <input matInput type="number" formControlName="quantity" min="0" step="1" />
        <mat-error>Enter a whole number, 0 or more.</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" min="0.01" step="0.01" />
        <mat-error>Enter a price with max 2 decimal places.</mat-error>
      </mat-form-field>
    </div>

    <mat-form-field class="full">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="3" maxlength="1000"></textarea>
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="18" class="btn-spinner" />
      }
      Save
    </button>
  </mat-dialog-actions>
</form>
