<div class="page-title">
  <h1>Sales</h1>
  <button mat-flat-button (click)="openAddSale()">
    <mat-icon>add_shopping_cart</mat-icon>
    Add Sale
  </button>
</div>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<div class="table-card">
  @if (loading()) {
    <div class="loading-overlay"><mat-spinner diameter="44" /></div>
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="sales()">
      <ng-container matColumnDef="soldOn">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let s">{{ s.soldOn | date: 'dd MMM yyyy, h:mm a' }}</td>
      </ng-container>

      <ng-container matColumnDef="medicineName">
        <th mat-header-cell *matHeaderCellDef>Medicine</th>
        <td mat-cell *matCellDef="let s">{{ s.medicineName }}</td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Qty</th>
        <td mat-cell *matCellDef="let s">{{ s.quantity }}</td>
      </ng-container>

      <ng-container matColumnDef="unitPrice">
        <th mat-header-cell *matHeaderCellDef>Unit Price</th>
        <td mat-cell *matCellDef="let s">{{ s.unitPrice | currency: 'INR' }}</td>
      </ng-container>

      <ng-container matColumnDef="totalAmount">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let s"><strong>{{ s.totalAmount | currency: 'INR' }}</strong></td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let s; columns: columns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty" [attr.colspan]="columns.length">{{ loading() ? '' : 'No sales yet.' }}</td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [length]="totalCount()"
    [pageIndex]="page - 1"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizes"
    showFirstLastButtons
    (page)="onPageChange($event)"
  />
</div>
